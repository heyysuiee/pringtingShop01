# Render Blueprint: https://render.com/docs/blueprint-spec
# Create the service from the Render dashboard: New > Blueprint > pick this repository.
services:
  - type: web
    name: printing-shop-system
    runtime: python
    plan: free
    buildCommand: pip install -r backend/app/requirements.txt
    # Do not let uvicorn trust client-supplied X-Forwarded-* headers: a FORWARDED_ALLOW_IPS of "*"
    # lets a visitor forge its apparent IP and bypass per-IP limits. The public scheme is configured
    # explicitly below, so the proxy-headers flag is not needed for same-origin checks or cookies.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PRINTSHOP_PUBLIC_SCHEME
        value: https
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PRINTSHOP_ENVIRONMENT
        value: production
      - key: PRINTSHOP_SECRET_KEY
        generateValue: true
      # Dedicated, stable backup signing key. Record retired keys in the previous-keys list when rotating.
      - key: PRINTSHOP_BACKUP_SIGNING_KEY
        sync: false
      - key: PRINTSHOP_BACKUP_PREVIOUS_SIGNING_KEYS
        sync: false
      # The service's own *.onrender.com host is added automatically (RENDER_EXTERNAL_HOSTNAME).
      # Add custom domains here, comma-separated.
      - key: PRINTSHOP_ALLOWED_HOSTS
        value: localhost
      # Free instances have no persistent disk: this SQLite file and uploads are wiped on every
      # redeploy, restart and spin-down. TURSO_DATABASE_URL/TURSO_AUTH_TOKEN are required: the app
      # refuses to start on Render without them.
      - key: PRINTSHOP_DATABASE_PATH
        value: /opt/render/project/src/backend/data/orders.sqlite3
      - key: PRINTSHOP_UPLOAD_DIR
        value: /opt/render/project/src/backend/data/order_uploads
      # Prompted for when the Blueprint is created.
      - key: PRINTSHOP_ADMIN_EMAIL
        sync: false
      - key: PRINTSHOP_ADMIN_PASSWORD_HASH
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: PRINTSHOP_SMTP_HOST
        sync: false
      - key: PRINTSHOP_SMTP_PORT
        value: "587"
      - key: PRINTSHOP_SMTP_USERNAME
        sync: false
      - key: PRINTSHOP_SMTP_PASSWORD
        sync: false
      - key: PRINTSHOP_SMTP_FROM
        sync: false
